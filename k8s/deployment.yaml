apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventorys-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventorys-service
  template:
    metadata:
      labels:
        app: inventorys-service
    spec:
      containers:
        - name: inventorys-service
          image: haripriya1310/typescript3-backend:v1
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: inventorys-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 80
      targetPort: 3000
  type: NodePort
